---
- name: Docker Container Deployment Playbook
  hosts: webservers
  become: true

  vars:
    NEXUS_REPO: "nexus.odochidevops.space"
    APP_IMAGE: "{{ NEXUS_REPO }}/nexus-docker-repo/apppetclinic:latest"

  tasks:

    - name: Update apt packages
      apt:
        update_cache: yes

    - name: Install required packages
      apt:
        name:
          - docker.io
          - python3-pip
        state: present

    - name: Start and enable Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Stop running container
      command: docker stop appContainer
      ignore_errors: yes

    - name: Remove stopped container
      command: docker rm appContainer
      ignore_errors: yes

    - name: Remove existing image
      command: docker rmi "{{ APP_IMAGE }}"
      ignore_errors: yes

    - name: Log into private Nexus registry
      shell: echo "admin123" | docker login "{{ NEXUS_REPO }}" -u admin --password-stdin

    - name: Pull latest image from Nexus
      command: docker pull "{{ APP_IMAGE }}"

    - name: Run container
      shell: |
        docker run -d \
        --name appContainer \
        -p 8080:8080 \
        --restart always \
        "{{ APP_IMAGE }}"