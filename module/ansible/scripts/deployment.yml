---
- name: Docker Container Deployment Playbook
  hosts: webservers
  become: true
  vars:
    NEXUS_REPO: "nexus.odochidevops.space"

  tasks:
    - name: Log into private Nexus registry
      become_user: ec2-user
      shell: echo "admin123" | docker login "{{ NEXUS_REPO }}" -u admin --password-stdin

    - name: Pull latest image from Nexus
      become_user: ec2-user
      command: docker pull "{{ NEXUS_REPO }}/nexus-docker-repo/apppetclinic:latest"

    - name: Ensure old container is removed (safe)
      become_user: ec2-user
      shell: |
        # Remove old container if it exists (even if running)
        docker ps -a -q --filter "name=appContainer" | grep -q . && docker rm -f appContainer || true

    - name: Run the Petclinic container
      become_user: ec2-user
      shell: |
        docker run -d \
          --name appContainer \
          -p 8080:8080 \
          --restart always \
          "{{ NEXUS_REPO }}/nexus-docker-repo/apppetclinic:latest"

