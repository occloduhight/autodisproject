---
- name: Docker Container Deployment Playbook
  hosts: webservers
  become: true

  vars:
    docker_repo: "nexus.odochidevops.space"
    docker_user: "admin"
    docker_password: "admin123"
    app_image: "{{ docker_repo }}/nexus-docker-repo/apppetclinic:latest"

  tasks:

    - name: Ensure Docker is installed
      command: docker --version
      register: docker_check
      changed_when: false

    - name: Remove existing container if it exists
      shell: docker rm -f appContainer || true

    - name: Login to Nexus Docker registry
      shell: |
        echo "{{ docker_password }}" | docker login {{ docker_repo }} \
        -u "{{ docker_user }}" --password-stdin
      no_log: true

    - name: Pull application image from Nexus
      command: docker pull {{ app_image }}

    - name: Run application container
      shell: |
        docker run -d \
        --name appContainer \
        -p 8080:8080 \
        --restart unless-stopped \
        {{ app_image }}

