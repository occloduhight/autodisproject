---
- name: Docker Container Deployment Playbook
  hosts: webservers
  become: true

  vars:
    NEXUS_REPO: "nexus.odochidevops.space"
    IMAGE_NAME: "{{ NEXUS_REPO }}/nexus-docker-repo/apppetclinic:latest"

  tasks:

    - name: Login to private Nexus registry
      shell: echo "admin123" | docker login "{{ NEXUS_REPO }}" -u admin --password-stdin

    - name: Remove existing container if present
      command: docker rm -f appContainer
      ignore_errors: yes

    - name: Remove existing image if present
      command: docker rmi "{{ IMAGE_NAME }}"
      ignore_errors: yes

    - name: Pull latest image
      command: docker pull "{{ IMAGE_NAME }}"

    - name: Run container
      command: >
        docker run -d
        --name appContainer
        -p 8080:8080
        --restart always
        {{ IMAGE_NAME }}