- name: Docker Container Deployment Playbook
  hosts: webservers
  become: true
  vars:
    NEXUS_REPO: "nexus.odochidevops.space"
    DB_HOST: "petclinic2-db-instance.us-east-1.rds.amazonaws.com"
    DB_PORT: 3306

  tasks:
    - name: Stop running container
      become: yes
      become_user: ec2-user
      command: docker stop appContainer
      ignore_errors: yes

    - name: Remove stopped container
      become: yes
      become_user: ec2-user
      command: docker rm appContainer
      ignore_errors: yes

    - name: Remove existing image
      become: yes
      become_user: ec2-user
      command: docker rmi "{{ NEXUS_REPO }}/nexus-docker-repo/apppetclinic:latest"
      ignore_errors: yes

    - name: Log into private Nexus registry
      become: yes
      become_user: ec2-user
      shell: echo "admin123" | docker login "{{ NEXUS_REPO }}" -u admin --password-stdin

    - name: Pull latest image from Nexus
      become: yes
      become_user: ec2-user
      command: docker pull "{{ NEXUS_REPO }}/nexus-docker-repo/apppetclinic:latest"

    - name: Ensure Docker network exists
      become: yes
      become_user: ec2-user
      shell: |
        docker network inspect app-network >/dev/null 2>&1 || docker network create app-network

    - name: Run app container connected to network
      become: yes
      become_user: ec2-user
      shell: |
        # Remove old container if exists
        if docker ps -a --format '{{ "{{.Names}}" }}' | grep -q '^appContainer$'; then
          docker rm -f appContainer
        fi

        # Run new container
        docker run -d \
          --name appContainer \
          --network app-network \
          -p 8080:8080 \
          --restart always \
          -e SPRING_DATASOURCE_URL="jdbc:mysql://{{ DB_HOST }}:{{ DB_PORT }}/myproject" \
          "{{ NEXUS_REPO }}/nexus-docker-repo/apppetclinic:latest"