---
- name: Docker Container Deployment Playbook
  hosts: webservers
  become: true
  vars:
    docker_repo: "nexus.odochidevops.space"
    docker_user: "admin"
    docker_password: "admin123"
    app_image: "{{ docker_repo }}/nexus-docker-repo/apppetclinic:latest"

  tasks:

    - name: Force remove existing container if it exists
      command: /usr/bin/docker rm -f appContainer
      ignore_errors: true

    - name: Login to private Nexus registry
      shell: echo "{{ docker_password }}" | /usr/bin/docker login {{ docker_repo }} -u {{ docker_user }} --password-stdin
      no_log: true

    - name: Pull latest application image
      command: /usr/bin/docker pull {{ app_image }}

    - name: Run application container
      command: /usr/bin/docker run -d --name appContainer -p 8080:8080 --restart unless-stopped {{ app_image }}
